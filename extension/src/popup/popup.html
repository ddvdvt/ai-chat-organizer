<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Органайзер ИИ-чатов</title>
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <img src="../../icons/icon32.png" width="22" height="22" alt="">
  <h1 data-i18n="extShortTitle">Органайзер ИИ-чатов</h1>
  <button id="openOrganizer" class="btn small" type="button" data-i18n="openOrganizerShort">Органайзер</button>
</header>

<main>
  <section id="here" class="card" aria-live="polite">
    <p class="muted" data-i18n="loading">Загрузка…</p>
  </section>

  <form id="searchForm" class="search" role="search">
    <input id="q" type="search" data-i18n-placeholder="searchAllPh" placeholder="Поиск по открытым чатам" aria-label="Поиск" data-i18n-title="searchAllPh">
    <button class="btn" type="submit" data-i18n="find">Найти</button>
  </form>

  <section class="sites" aria-labelledby="sitesTitle">
    <h2 id="sitesTitle" data-i18n="sitesTitle">Где работает расширение</h2>
    <ul id="sites"></ul>
    <p class="muted small" data-i18n="sitesNote">Расширение работает только на включённых сайтах. Доступ можно отозвать в любой момент.</p>
  </section>

  <p id="stats" class="muted small stats"></p>
</main>

<footer class="footer">
  <span data-i18n="localOnly">Данные хранятся только у вас</span>
  <a href="#" data-brand-link="other" target="_blank" rel="noopener" data-i18n="otherExtensions">Другие расширения автора</a>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
